name: engine smoke

# Merge-contract gate (design D3, task 6.2): after any engine bump (patched
# submodule change), apply patches/, build the carve as a host smoke tool, and
# assert the known "smoke" word looks up to non-empty HTML. A failing smoke
# stops the bump.

on:
  push:
    paths:
      - "engine/**"
      - "patches/**"
      - "app/src/main/cpp/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      engine_tag:
        description: "New goldendict-ng tag to test (leave empty to use engine/)"
        required: false
        default: ""

jobs:
  smoke:
    runs-on: windows-2022
    env:
      QT_VERSION: "6.6.3"
      QT_ARCH: "win64_msvc2019_64"
      VCPKG_ROOT: "${{ github.workspace }}/vcpkg"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: (Optional) Bump engine submodule to workflow_dispatch tag
        if: inputs.engine_tag != ''
        run: |
          git -C engine fetch --tags
          git -C engine checkout "${{ inputs.engine_tag }}"
          git submodule update --init --recursive

      - name: Apply deviation patches
        shell: bash
        run: ./scripts/apply-patches.sh

      - name: Setup Python / aqtinstall
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin py7zr==1.1.0: the 1.1.3 path-sanitization change (miurahr/py7zr#743)
      # raises "Bad7zFile: Specified path is bad" on spurious './' members in Qt
      # archives, breaking the install on Windows roughly half the time.
      - run: pip install "py7zr==1.1.0"
      - run: pip install aqtinstall

      - name: Install Qt host kit (moc/rcc + libs)
        shell: bash
        run: |
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ env.QT_ARCH }} -O "${{ github.workspace }}/qt"

      - name: Setup vcpkg (cross-compiled deps mimicked on host)
        shell: bash
        run: |
          # Baseline matches local dev (C:\vcpkg @ 2026.07.29). Older baselines
          # (e.g. 2024.05.24) reference a pkgconf package that has since been
          # removed from the MSYS2 mirrors, breaking the bzip2 port build.
          git clone --depth 1 --branch 2026.07.29 https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}" || true
          "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.bat" -disableMetrics
          "${{ env.VCPKG_ROOT }}/vcpkg.exe" install zlib bzip2 liblzma lzo fmt libiconv xapian --triplet x64-windows

      - name: Configure host smoke build
        shell: bash
        run: |
          cmake -S app/src/main/cpp/engine -B build-gh -G "Visual Studio 17 2022" -A x64 \
            -DQT_BASE="${{ github.workspace }}/qt/${{ env.QT_VERSION }}/msvc2019_64" \
            -DQT_HOST_PATH="${{ github.workspace }}/qt/${{ env.QT_VERSION }}/msvc2019_64" \
            -DVCPKG_BASE="${{ env.VCPKG_ROOT }}" \
            -DAURELEX_BUILD_SMOKE=ON

      - name: Build smoke tool
        shell: bash
        run: |
          cmake --build build-gh --config Release --target aurelex_smoke

      - name: Generate smoke StarDict fixture
        shell: bash
        run: |
          python scripts/make-smoke-stardict.py "$RUNNER_TEMP/dic"
          mkdir -p "$RUNNER_TEMP/cfg"

      - name: Generate DSL + .dsl.dz fixture (compressed DSL path)
        shell: bash
        run: |
          python scripts/make-example-dicts.py "$RUNNER_TEMP/dsl"
          # Copy the compressed variant into the smoke dict folder so the scan
          # also exercises the dictzip (.dsl.dz) reader.
          cp "$RUNNER_TEMP/dsl/aurelex-basic.dsl.dz" "$RUNNER_TEMP/dic/"

      - name: Run smoke and assert non-empty HTML
        shell: bash
        run: |
          # The carve links Qt6Core/Gui/Xml; the Windows platform plugin is
          # needed too. Relying on an exported PATH entry into the workspace
          # has proven fragile on the runner (native DllMain failure surfaces as
          # a bare exit code 127 with no output), so stage the DLLs and the
          # plugin next to the exe and keep the PATH export as a fallback.
          QT_ROOT="${{ github.workspace }}/qt/${{ env.QT_VERSION }}/msvc2019_64"
          export PATH="$QT_ROOT/bin:$PATH"
          echo "=== Qt bin ==="
          ls -1 "$QT_ROOT/bin"/Qt6Core.dll "$QT_ROOT/bin"/Qt6Gui.dll "$QT_ROOT/bin"/Qt6Xml.dll
          echo "=== Qt platform plugin ==="
          ls -1 "$QT_ROOT/plugins/platforms"/qwindows.dll
          cp "$QT_ROOT/bin"/Qt6Core.dll "$QT_ROOT/bin"/Qt6Gui.dll "$QT_ROOT/bin"/Qt6Xml.dll build-gh/Release/
          mkdir -p build-gh/Release/plugins/platforms
          cp "$QT_ROOT/plugins/platforms/qwindows.dll" build-gh/Release/plugins/platforms/
          echo "=== staged tool dir ==="
          ls -1 build-gh/Release
          export QT_DEBUG_PLUGINS=1
          out=$(./build-gh/Release/aurelex_smoke.exe "$RUNNER_TEMP/cfg" "$RUNNER_TEMP/dic" smoke 2>&1)
          ex=$?
          echo "SMOKE_EXE_EXIT=$ex"
          echo "$out"
          test "$ex" -eq 0 || { echo "SMOKE FAILED: exe exited $ex"; exit 1; }
          printf '%s' "$out" | grep -q "gd_lookup(\"smoke\") -> [1-9]" \
            || { echo "SMOKE FAILED: gd_lookup returned no HTML"; exit 1; }
          # The folder now contains the StarDict fixture + a .dsl.dz; the scan
          # must report both (2 dictionaries).
          printf '%s' "$out" | grep -q "gd_scan_dicts -> 2" \
            || { echo "SMOKE FAILED: expected 2 dictionaries (stardict + dsl.dz)"; exit 1; }
          # Re-scanning the same folder must not duplicate loaded dictionaries.
          printf '%s' "$out" | grep -q "gd_scan_dicts(again) -> 0" \
            || { echo "SMOKE FAILED: dedup on re-scan"; exit 1; }
          # Removing a dictionary drops it (count shrinks, its headword stops
          # resolving) and a re-scan re-adds it.
          printf '%s' "$out" | grep -q "REMOVE_DICT=OK" \
            || { echo "SMOKE FAILED: dictionary removal"; exit 1; }
          printf '%s' "$out" | grep -q "REMOVE_READD=OK" \
            || { echo "SMOKE FAILED: re-add after removal"; exit 1; }
          # Full-text search must work end-to-end: index the StarDict fixture,
          # search a term that lives in an article BODY ("mdx"), get the
          # article's headword ("smoke") back.
          printf '%s' "$out" | grep -q "FTS_BODY=OK" \
            || { echo "SMOKE FAILED: full-text search assertion"; exit 1; }
          # Wildcard mode must expand multi-term prefixes (pins patch 0003).
          printf '%s' "$out" | grep -q "FTS_WILD=OK" \
            || { echo "SMOKE FAILED: full-text wildcard assertion"; exit 1; }
          echo "SMOKE OK"
