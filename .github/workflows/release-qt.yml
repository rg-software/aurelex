name: release build (Qt)

# On tag push (vX.Y.Z) builds a SIGNED release APK + AAB from the Qt app
# (app/), attaches them to a GitHub release, and — for well-formed release tags
# only — publishes the AAB to the Google Play internal testing track. The APK
# covers GitHub/F-Droid/sideload (~/pkg org.aurelex.pocket.dictionary); the AAB
# is the Google Play upload artifact. The Kotlin app (app/ — historically the
# Compose UI) was removed; this is the only release workflow.
#
# Publishing policy: master pushes and workflow_dispatch NEVER publish to any
# store — only a well-formed release tag (vMAJOR.MINOR.PATCH, each < 100) opens
# the publish gate, the same predicate that derives the versionCode. If the Play
# publish fails, the signed APK + AAB are already attached to the GitHub release.
#
# Why Windows: app/build.ps1 targets a Windows aqt 6.6.3
# layout. The carve (engine/) compiles under the same script. Build time is
# ~25-40 min on a 4-vcpu windows-latest runner (xapian dominates; cached on
# the 2nd run, see the vcpkg cache step below).
#
# Signing secrets (per docs/SIGNING.md):
#   AURELEX_KEYSTORE_BASE64   base64-encoded .jks release keystore
#   AURELEX_KEYSTORE_PASSWORD keystore password
#   AURELEX_KEY_ALIAS         key alias
#   AURELEX_KEY_PASSWORD      key password
#
# Play publishing secret (per docs/SIGNING.md):
#   PLAY_SERVICE_ACCOUNT_JSON Google Cloud service account JSON with release
#                             access to this app in Play Console

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      QT_ROOT: ${{ github.workspace }}\qt
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      NDK_ROOT: ${{ github.workspace }}\ndk\android-ndk-r23c
      ANDROID_SDK_ROOT: ${{ github.workspace }}\android-sdk
      AURELEX_QT_BASE: ${{ github.workspace }}\qt\6.6.3
      AURELEX_QT_HOST: ${{ github.workspace }}\qt\6.6.3\mingw_64
      AURELEX_VCPKG_BASE: ${{ github.workspace }}\vcpkg
      AURELEX_NDK_ROOT: ${{ github.workspace }}\ndk\android-ndk-r23c
      AURELEX_ANDROID_SDK: ${{ github.workspace }}\android-sdk
      # The ABI the app is built and packaged for, and the single source of
      # truth for it: passed to app/build.ps1 -Abi, and re-exported as
      # PACKAGED_ABIS for the vendored-TLS assertion further down. The
      # dependency chain is arm64-only today (vcpkg arm64-android triplet,
      # xapian built for arm64-v8a, build.gradle.properties
      # qtTargetAbiList=arm64-v8a), so arm64-v8a is the only value that
      # builds. It is named here rather than inferred, because a runner also
      # has an unused android_x86_64 kit installed (see the aqt step) and
      # "which kits are installed" is not "which ABIs ship" -- assuming so made
      # the TLS assertion demand x86_64 entries that no build produces.
      AURELEX_ABI: arm64-v8a
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Record JDK path for build.ps1
        shell: pwsh
        run: |
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          "AURELEX_JDK17=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - name: Install CMake
        # Unity's bundled cmake 3.22.1 is not available on the runner; install
        # a portable one. cmake 3.22+ is required by Qt6.
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          $cmake = (Get-Command cmake.exe).Source
          Write-Host "cmake at: $cmake"
          "AURELEX_CMAKE_EXE=$cmake" >> $env:GITHUB_ENV

      - name: Install Gradle (for the carve-subset androiddeployqt which stages no wrapper)
        shell: pwsh
        run: |
          # androiddeployqt --no-build in the carve-subset kit generates no
          # gradlew.bat / gradle-wrapper.jar; build.ps1 falls back to a Gradle
          # install pointed at by AURELEX_GRADLE_HOME. Use the same 8.3 the
          # wrapper properties pin.
          $zip = "$env:RUNNER_TEMP\gradle.zip"
          $dst = "$env:RUNNER_TEMP\gradle-dist"
          Invoke-WebRequest -UseBasicParsing -Uri "https://services.gradle.org/distributions/gradle-8.3-bin.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          "AURELEX_GRADLE_HOME=$dst\gradle-8.3" >> $env:GITHUB_ENV

      - name: Install NDK r23c
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\android-ndk-r23c-windows.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://dl.google.com/android/repository/android-ndk-r23c-windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:GITHUB_WORKSPACE\ndk" -Force
          # Expand-Archive creates .../android-ndk-r23c/...; normalize.
          if (-not (Test-Path "$env:NDK_ROOT")) {
            Rename-Item (Join-Path "$env:GITHUB_WORKSPACE\ndk" "android-ndk-r23c") "android-ndk-r23c" -ErrorAction SilentlyContinue
          }

      - name: Install Android SDK (command-line tools)
        shell: pwsh
        run: |
          $cli = "$env:RUNNER_TEMP\cmdline-tools.zip"
          $tmp = "$env:RUNNER_TEMP\cmdline-tools-extract"
          Invoke-WebRequest -UseBasicParsing -Uri "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip" -OutFile $cli
          New-Item -ItemType Directory -Force -Path "$env:ANDROID_SDK_ROOT\cmdline-tools" | Out-Null
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -Path $cli -DestinationPath $tmp -Force
          # The zip extracts to <tmp>/cmdline-tools/bin/sdkmanager.bat; rename
          # that single inner dir to "latest" so the SDK layout is:
          #   <sdk>/cmdline-tools/latest/bin/sdkmanager.bat
          New-Item -ItemType Directory -Force -Path "$env:ANDROID_SDK_ROOT\cmdline-tools\latest" | Out-Null
          Get-ChildItem (Join-Path $tmp "cmdline-tools") -Force | Move-Item -Destination "$env:ANDROID_SDK_ROOT\cmdline-tools\latest" -Force
          # Accept licenses BEFORE sdkmanager: it prompts interactively (and
          # fails non-interactively, silently skipping build-tools) if the
          # license hash files are absent.
          $licensesDir = "$env:ANDROID_SDK_ROOT\licenses"
          New-Item -ItemType Directory -Force -Path $licensesDir | Out-Null
          $sdkLicense = "24333f8a63b6825ea9c5514f83c2829b004d1fee`n84831b9409646a918e30573bab4c9c91346d8abd"
          Set-Content -Path "$licensesDir\android-sdk-license" -Value $sdkLicense -Encoding ASCII
          $previewLicense = "8933bad161af4178b1185d1a37fbf41ea5269c55"
          Add-Content -Path "$licensesDir\android-sdk-preview-license" -Value $previewLicense -Encoding ASCII
          & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" --sdk_root="$env:ANDROID_SDK_ROOT" `
            "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path "$env:ANDROID_SDK_ROOT\build-tools\36.0.0")) {
            throw "build-tools/36.0.0 not installed under $env:ANDROID_SDK_ROOT"
          }

      - name: Install Qt 6.6.3 (host + android kits)
        shell: pwsh
        run: |
          # Pin py7zr==1.1.0: the 1.1.3 path-sanitization change (miurahr/py7zr#743)
          # raises Bad7zFile on spurious './' archive members, breaking aqt install
          # (same pin as engine-smoke.yml).
          pip install "py7zr==1.1.0"
          pip install aqtinstall
          # MinGW host kit: windows-latest runners don't ship Visual Studio,
          # and the Qt android target uses the NDK's own clang so the host
          # compiler doesn't need to be MSVC. The carve is C++17 and links
          # only against vcpkg + Qt + Android system libs, which MinGW handles.
          python -m aqt install-qt windows desktop 6.6.3 win64_mingw -O "$env:QT_ROOT"
          # Android kits — what the carve links against. qtwebview is a
          # separate module (not in the base archives); it depends on
          # qtwebchannel (the qwebchannel.js transport). Install both.
          python -m aqt install-qt windows android 6.6.3 android_arm64_v8a -O "$env:QT_ROOT" --modules qtwebview qtwebchannel
          python -m aqt install-qt windows android 6.6.3 android_x86_64 -O "$env:QT_ROOT" --modules qtwebview qtwebchannel
          $deploy = "$env:AURELEX_QT_HOST\bin\androiddeployqt.exe"
          "AURELEX_DEPLOYQT=$deploy" >> $env:GITHUB_ENV
          if (-not (Test-Path $deploy)) { throw "androiddeployqt.exe not at $deploy" }

      - name: Cache vcpkg + xapian install (arm64-android)
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}\installed\arm64-android
          key: vcpkg-arm64-${{ hashFiles('scripts/build-xapian-android.sh', '.github/workflows/release-qt.yml') }}
          restore-keys: |
            vcpkg-arm64-

      - name: Bootstrap vcpkg + install carve deps
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            git clone --depth 1 --branch 2026.07.29 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" install zlib bzip2 liblzma lzo fmt --triplet arm64-android

      - name: Build xapian for Android
        shell: bash
        run: |
          # The xapian autoconf build needs a POSIX-aware GNU make + sh. Git
          # Bash's Windows-native make breaks recipes that exec ./config.status
          # or $(SHELL) scripts ("make (e=2)", "C:/Program: No such file"), and
          # the NDK .cmd wrappers can't be exec'd by any POSIX sh (the script
          # wraps the .exe tools itself). The script prefers MSYS2's make + sh
          # at C:\msys64; ensure MSYS2 make is installed if the preinstalled
          # C:\msys64 lacks it.
          if [ ! -x /c/msys64/usr/bin/bash.exe ]; then
            choco install -y msys2 --params "/NoUpdate /InstallDir:C:\msys64" --no-progress
          fi
          /c/msys64/usr/bin/bash.exe -lc "pacman -S --needed --noconfirm make 2>/dev/null || true"
          ./scripts/build-xapian-android.sh "$NDK_ROOT" arm64-v8a "$VCPKG_ROOT/installed/arm64-android"

      - name: Apply engine patches
        shell: bash
        run: ./scripts/apply-patches.sh

      - name: Decode release keystore
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.AURELEX_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_B64) {
            Write-Host "AURELEX_KEYSTORE_BASE64 not set; skipping keystore decode (unsigned build)."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:KEYSTORE_B64)
          if ($bytes.Length -eq 0) { throw "AURELEX_KEYSTORE_BASE64 is set but decodes to zero bytes" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release.jks", $bytes)
          Write-Host "keystore written to $env:RUNNER_TEMP\release.jks"

      - name: Derive version props from the release tag
        shell: bash
        run: |
          # A well-formed release tag both encodes a versionCode and opens the
          # Play publish gate (release-qt.yml header). The gate is only set for
          # tags whose components fit the encoding (each < 100), so the
          # deterministic versionCode cannot collide; any other ref (branch push,
          # workflow_dispatch) leaves it unset and publishes nothing.
          publish=""
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] \
             && (( BASH_REMATCH[1] < 100 && BASH_REMATCH[2] < 100 && BASH_REMATCH[3] < 100 )); then
            vc=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            echo "AURELEX_VERSION_NAME=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
            echo "AURELEX_VERSION_CODE=$vc" >> "$GITHUB_ENV"
            publish=1
          else
            echo "AURELEX_VERSION_NAME=" >> "$GITHUB_ENV"
            echo "AURELEX_VERSION_CODE=" >> "$GITHUB_ENV"
          fi
          echo "AURELEX_PUBLISH=$publish" >> "$GITHUB_ENV"
          echo "AURELEX_PUBLISH=$publish" >> "$GITHUB_OUTPUT"
        id: version

      - name: Build signed release APK + AAB
        shell: pwsh
        env:
          AURELEX_KEYSTORE_PATH: ${{ runner.temp }}\release.jks
          AURELEX_KEYSTORE_PASSWORD: ${{ secrets.AURELEX_KEYSTORE_PASSWORD }}
          AURELEX_KEY_ALIAS: ${{ secrets.AURELEX_KEY_ALIAS }}
          AURELEX_KEY_PASSWORD: ${{ secrets.AURELEX_KEY_PASSWORD }}
        run: |
          if (Test-Path "$env:AURELEX_KEYSTORE_PATH") {
            Write-Host "=== signed build ==="
            & "$env:GITHUB_WORKSPACE\app\build.ps1" -Abi $env:AURELEX_ABI -Configuration Release -Bundle
            if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed" }
          } else {
            Write-Host "=== AURELEX_KEYSTORE_PATH not present; building unsigned release APK + AAB for dry-run ===" -ForegroundColor Yellow
            & "$env:GITHUB_WORKSPACE\app\build.ps1" -Abi $env:AURELEX_ABI -Configuration Release -Bundle
            if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed" }
          }

      - name: Locate release APK + AAB
        id: artifacts
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\build-qtquick\apk\build\outputs"
          $apk = Get-ChildItem "$root\apk\release" -Filter "*.apk" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $apk) { throw "no release APK produced" }
          $aab = Get-ChildItem "$root\bundle\release" -Filter "*.aab" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $aab) { throw "no release AAB produced (bundleRelease)" }
          Write-Host "release APK: $($apk.FullName) ($([math]::Round($apk.Length/1MB,1)) MB)"
          Write-Host "release AAB: $($aab.FullName) ($([math]::Round($aab.Length/1MB,1)) MB)"
          "APK_PATH=$($apk.FullName)" >> $env:GITHUB_OUTPUT
          "AAB_PATH=$($aab.FullName)" >> $env:GITHUB_OUTPUT
          # The ABI these artifacts were built for, so the vendored-TLS
          # assertion checks the ABIs that actually ship instead of guessing
          # from the Qt kits installed on the runner.
          "PACKAGED_ABIS=$env:AURELEX_ABI" >> $env:GITHUB_OUTPUT
          # Workspace-relative, forward-slash path for the Play upload action:
          # its file matcher runs on Node and cannot resolve an absolute Windows
          # (backslash) path (it reports "no release file matching <path>").
          $aabRel = $aab.FullName.Substring($env:GITHUB_WORKSPACE.Length).TrimStart('\').Replace('\', '/')
          Write-Host "release AAB (relative): $aabRel"
          "AAB_REL=$aabRel" >> $env:GITHUB_OUTPUT

      # Qt's Android TLS is the OpenSSL backend, which dlopen()s
      # libcrypto_3.so / libssl_3.so at run time; the Qt android kit does not ship
      # them, so they are vendored in app/openssl/<abi> and packaged via
      # QT_ANDROID_EXTRA_LIBS. Without them the shipped app has NO working TLS and
      # every QNetworkAccessManager HTTPS request fails with "TLS initialization
      # failed" -- the remote dictionary catalog being the only feature to notice.
      # The WebView is unaffected (Chromium has its own TLS), so nothing else in
      # the app reveals it. The CMake configure step already fails when the libs
      # are missing from the checkout; this asserts they survived packaging, which
      # is the last point before the artifact is published.
      - name: Assert vendored TLS libraries are in the packaged artifacts
        shell: pwsh
        # The artifacts step publishes the located paths as step *outputs*
        # (GITHUB_OUTPUT), which become ${{ steps.artifacts.outputs.* }} in YAML
        # but are NOT process env vars in later steps. Map them in explicitly --
        # otherwise $env:APK_PATH / $env:AAB_PATH are empty and this step fails on
        # its own wiring ("path not set by the artifacts step") before it ever
        # opens a zip, which is a false alarm, not a missing-TLS finding.
        env:
          APK_PATH: ${{ steps.artifacts.outputs.APK_PATH }}
          AAB_PATH: ${{ steps.artifacts.outputs.AAB_PATH }}
          PACKAGED_ABIS: ${{ steps.artifacts.outputs.PACKAGED_ABIS }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          # Which ABIs must the artifact contain? Exactly the ones this build
          # targeted, which the artifacts step re-exports as PACKAGED_ABIS from
          # the same AURELEX_ABI the build script was invoked with. Deriving it
          # from the Qt kits *installed on the runner* (the previous approach)
          # is wrong: the runner also has an unused android_x86_64 kit, and the
          # app is arm64-only (vcpkg arm64-android, xapian arm64-v8a,
          # qtTargetAbiList=arm64-v8a), so that demanded x86_64 entries no build
          # produces and failed the release on an ABI nothing ships.
          $abis = @($env:PACKAGED_ABIS -split "," | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if (-not $abis) { throw "PACKAGED_ABIS not set by the artifacts step" }
          # Every built ABI must also be vendored. The CMake configure step
          # already fails in that case, so getting here means the guard was
          # bypassed -- say so rather than quietly checking a smaller set.
          $vendored = @(Get-ChildItem "$env:GITHUB_WORKSPACE\app\openssl" -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Name })
          $unvendored = @($abis | Where-Object { $vendored -notcontains $_ })
          if ($unvendored) {
              throw "built ABI(s) not vendored under app/openssl: $($unvendored -join ', ') (vendored: $($vendored -join ', ')) -- the CMake guard should have failed the configure step"
          }
          Write-Host "Packaged ABIs: $($abis -join ', ')"
          $libs = @("libcrypto_3.so", "libssl_3.so")

          $failures = @()
          foreach ($artifact in @(
              @{ Label = "APK"; Path = $env:APK_PATH; Prefix = "lib/{0}" },
              @{ Label = "AAB"; Path = $env:AAB_PATH; Prefix = "base/lib/{0}" })) {
              if (-not $artifact.Path) { $failures += "$($artifact.Label): path not set by the artifacts step"; continue }
              if (-not (Test-Path $artifact.Path)) { $failures += "$($artifact.Label): not found: $($artifact.Path)"; continue }
              $zip = [System.IO.Compression.ZipFile]::OpenRead($artifact.Path)
              try {
                  $entries = @($zip.Entries | ForEach-Object { $_.FullName })
                  # Local .so files carry no compression in an APK/AAB, but do not
                  # rely on that: match on the entry name, whatever the method.
                  foreach ($abi in $abis) {
                      foreach ($lib in $libs) {
                          $expected = $artifact.Prefix.Replace("{0}", $abi) + "/" + $lib
                          if ($entries -contains $expected) {
                              Write-Host "  OK  $($artifact.Label)  $expected"
                          } else {
                              $failures += "$($artifact.Label): missing '$expected' (Qt dlopen()s it at run time; Qt TLS is dead without it)"
                              Write-Host "  MISSING  $($artifact.Label)  $expected"
                          }
                      }
                  }
              } finally { $zip.Dispose() }
          }

          if ($failures) {
              Write-Host ""
              Write-Host "Vendored TLS libraries are not correctly packaged. Entries actually present under lib/:"
              foreach ($artifact in @($env:APK_PATH, $env:AAB_PATH)) {
                  if (-not $artifact -or -not (Test-Path $artifact)) { continue }
                  $zip = [System.IO.Compression.ZipFile]::OpenRead($artifact)
                  try {
                      Write-Host "--- $([System.IO.Path]::GetFileName($artifact)) ---"
                      $zip.Entries | Where-Object { $_.FullName -match '(^|/)lib[^/]*/.*\.so$' } |
                          ForEach-Object { Write-Host "  $($_.FullName)" }
                  } finally { $zip.Dispose() }
              }
              Write-Host ""
              $failures | ForEach-Object { Write-Host "FAIL: $_" -ForegroundColor Red }
              throw "packaged artifacts are missing the vendored TLS libraries; refusing to publish"
          }
          Write-Host "vendored TLS libraries present in both artifacts for: $($abis -join ', ')"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurelex-qt-release
          path: |
            ${{ steps.artifacts.outputs.APK_PATH }}
            ${{ steps.artifacts.outputs.AAB_PATH }}
          if-no-files-found: error

      - name: Create GitHub release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.APK_PATH }}
            ${{ steps.artifacts.outputs.AAB_PATH }}
          generate_release_notes: true

      # Runs only for a well-formed release tag (see the version step's gate) and
      # only after the signed AAB is located and the GitHub release has been
      # created, so a Play failure never costs the release artifacts (D4).
      - name: Publish AAB to Play internal testing
        if: steps.version.outputs.AURELEX_PUBLISH == '1'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.aurelex.pocket.dictionary
          releaseFiles: ${{ steps.artifacts.outputs.AAB_REL }}
          track: internal
          status: completed